<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>行動記録</title>

    <link rel="stylesheet" href="style.css?v=20260902-1">
   
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#ffffff">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <meta name="apple-mobile-web-app-title" content="行動記録">

    <link rel="apple-touch-icon" href="icons/icon-192.png">

</head>

<body>

    <div class="app">

        <h1>行動記録</h1>
        <div class="time" id="current-time">
            --:--:--
        </div>

        <div class="button-area" id="button-area">
        </div>

        <div class="selected-area">
            選択中：
            <span id="selected-action">未選択</span>
        </div>

        <button class="record-button" id="record-button">
            記録する
        </button>
        
        <button id="settings-button" class="settings-button">
             ⚙ 設定
        </button>

        <div class="history">

        <div class="history-header">
            <h2>本日の履歴</h2>

            <button id="undo-button" class="undo-button">
                直前の記録を取り消す
            </button>
        </div>

        <div id="history-list">
            <p>まだ記録はありません。</p>
        </div>

    </div>

    <button class="csv-button" id="csv-button">
        CSV出力
    </button>
    <div id="settings-screen" class="settings-screen hidden">

        <div class="settings-header">

            <h2>行動項目設定</h2>

            <button id="settings-close-button"
                    class="settings-close-button">
                閉じる
            </button>

        </div>

        <div id="action-settings-list">
        </div>

        <div class="add-action-area">

            <input
                type="text"
                id="new-action-name"
                placeholder="新しい行動項目">

            <button id="add-action-button">
                追加
            </button>

        </div>

    </div>
    </div>

    <script src="app.js"></script>

</body>

</html>
